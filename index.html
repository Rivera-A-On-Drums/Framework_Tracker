<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEADY // Leadership Log</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0603;
    --panel: #140D06;
    --panel-border: #3D2A10;
    --cyan: #FFB000;
    --magenta: #FF6B35;
    --violet: #FFB000;
    --text: #FFD37A;
    --text-dim: #7A5A20;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.93; }
    94% { opacity: 1; }
    96% { opacity: 0.96; }
    97% { opacity: 1; }
  }
  @keyframes cursorblink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .cursor {
    display: inline-block; width: 9px; height: 15px;
    background: var(--cyan); margin-left: 6px; vertical-align: -2px;
    box-shadow: 0 0 8px var(--cyan);
    animation: cursorblink 1s steps(1) infinite;
  }
  body {
    animation: flicker 7s infinite;
    box-shadow: inset 0 0 140px rgba(0,0,0,0.7);
  }
  body {
    font-family: 'VT323', monospace;
    background:
      linear-gradient(180deg, rgba(255,176,0,0.04), transparent 200px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color: var(--text);
    padding: 20px 14px 40px;
    min-height: 100vh;
  }
  .wrap { max-width: 460px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 18px; }
  .tag {
    font-size: 11px; letter-spacing: 0.25em; color: var(--cyan);
    text-shadow: 0 0 8px rgba(255,176,0,0.6);
  }
  .date {
    font-size: 12px; color: var(--text-dim); margin-top: 6px; letter-spacing: 0.05em;
  }
  .vision {
    font-family: 'VT323', monospace; letter-spacing: 0.04em;
    font-size: 15px; font-weight: 500; line-height: 1.6;
    color: var(--text); margin-top: 14px;
    border-left: 2px solid var(--magenta);
    padding-left: 12px; text-align: left;
  }

  .tabs { display: flex; gap: 2px; margin-top: 20px; border: 1px solid var(--panel-border); }
  .tab {
    flex: 1; text-align: center; padding: 10px; font-size: 11px;
    letter-spacing: 0.15em; color: var(--text-dim); cursor: pointer;
    background: var(--panel);
  }
  .tab.active {
    color: #05070A; background: var(--cyan);
    text-shadow: none; font-weight: bold;
  }

  .streak-row {
    display: flex; align-items: baseline; gap: 10px;
    margin-top: 22px; padding: 14px; background: var(--panel);
    border: 1px solid var(--panel-border); clip-path: polygon(0 0, 100% 0, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .streak-num {
    font-family: 'VT323', monospace; letter-spacing: 0.04em; font-size: 32px; font-weight: 900;
    color: var(--magenta); text-shadow: 0 0 14px rgba(255,107,53,0.7);
  }
  .streak-label { font-size: 11px; letter-spacing: 0.1em; color: var(--text-dim); }

  .week { display: flex; gap: 5px; margin-top: 12px; }
  .week .day {
    flex: 1; height: 30px; display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--text-dim); background: var(--panel);
    border: 1px solid var(--panel-border);
  }
  .week .day.lit { border-color: var(--cyan); color: #05070A; font-weight: bold; }

  .cards { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .pcard {
    background: var(--panel); border: 1px solid var(--panel-border);
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; cursor: pointer; position: relative; overflow: hidden;
  }
  .pcard::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--panel-border);
  }
  .pcard.done { border-color: var(--cyan); background: rgba(255,176,0,0.06); }
  .pcard.done::before { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  .pcard-title {
    font-family: 'VT323', monospace; letter-spacing: 0.04em; font-size: 13px; letter-spacing: 0.06em;
    color: var(--text); text-transform: uppercase;
  }
  .pcard-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .check {
    width: 22px; height: 22px; border: 1px solid var(--text-dim);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--text-dim); flex-shrink: 0;
  }
  .pcard.done .check {
    border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 8px rgba(255,176,0,0.6);
  }

  .footer-note {
    margin-top: 18px; font-size: 10px; color: var(--text-dim); text-align: center;
    letter-spacing: 0.05em;
  }

  .history { display: none; margin-top: 20px; }
  .history.active { display: block; }
  .hist-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 4px; border-bottom: 1px solid var(--panel-border); font-size: 12px;
  }
  .hist-date { color: var(--text-dim); letter-spacing: 0.04em; }
  .hist-dots { display: flex; gap: 5px; }
  .hist-dot { width: 8px; height: 8px; background: var(--panel-border); }
  .hist-dot.on { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
  .hist-empty { text-align: center; color: var(--text-dim); font-size: 12px; padding: 30px 0; }
  .legend { display: flex; gap: 12px; margin-top: 16px; font-size: 10px; color: var(--text-dim); flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend .dot { width: 7px; height: 7px; background: var(--cyan); box-shadow: 0 0 5px var(--cyan); }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="tag">// STEADY_LOG</div>
    <div class="date" id="date-label">LOADING...</div>
    <div class="vision">I read situations early, set a pace others can rely on, and stay steady when everything around me is in motion.</div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-today">TODAY</div>
    <div class="tab" id="tab-history">HISTORY</div>
  </div>

  <div id="today-view">
    <div class="streak-row">
      <span class="streak-num" id="streak-num">0</span>
      <span class="streak-label">DAY<br>STREAK</span>
    </div>
    <div class="week" id="week-strip"></div>
    <div class="cards" id="cards"></div>
    <div class="footer-note">TAP A PRINCIPLE WHEN IT WAS TRUE TODAY</div>
  </div>

  <div class="history" id="history-view">
    <div id="hist-list"></div>
    <div class="legend">
      <span><span class="dot"></span> TEMPO</span>
      <span><span class="dot"></span> CONNECTS</span>
      <span><span class="dot"></span> QUIET INTEL</span>
      <span><span class="dot"></span> COMPOSURE</span>
    </div>
  </div>
</div>

<script>
(function() {
  const PRINCIPLES = [
    { key: 't', title: 'Tempo Control', sub: 'Paced a decision instead of just reacting' },
    { key: 'c', title: 'Connective Range', sub: 'Translated something across a gap' },
    { key: 'q', title: 'Quiet Intelligence', sub: 'Did unseen work that mattered' },
    { key: 'p', title: 'Composure', sub: 'Stayed steady while something shifted' }
  ];
  const STORAGE_PREFIX = 'steady_entries_';

  function fmtDate(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function dayLabel(d) { return d.toLocaleDateString(undefined, { weekday: 'short' })[0]; }

  const today = new Date();
  const todayKey = fmtDate(today);
  let entry = { t: false, c: false, q: false, p: false };

  function loadEntry(key) {
    try {
      const raw = localStorage.getItem(STORAGE_PREFIX + key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function saveEntry(key, data) {
    try {
      localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(data));
      return true;
    } catch (e) { return false; }
  }

  document.getElementById('date-label').textContent =
    today.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }).toUpperCase();
  const cursorSpan = document.createElement('span');
  cursorSpan.className = 'cursor';
  document.getElementById('date-label').appendChild(cursorSpan);

  const existing = loadEntry(todayKey);
  if (existing) entry = existing;

  function renderCards() {
    const cardsEl = document.getElementById('cards');
    cardsEl.innerHTML = '';
    PRINCIPLES.forEach(p => {
      const done = !!entry[p.key];
      const card = document.createElement('div');
      card.className = 'pcard' + (done ? ' done' : '');
      card.innerHTML = `
        <div>
          <div class="pcard-title">${p.title}</div>
          <div class="pcard-sub">${p.sub}</div>
        </div>
        <div class="check">${done ? '✓' : ''}</div>
      `;
      card.addEventListener('click', () => {
        entry[p.key] = !entry[p.key];
        saveEntry(todayKey, entry);
        renderCards();
        buildWeekAndStreak();
      });
      cardsEl.appendChild(card);
    });
  }

  function buildWeekAndStreak() {
    const weekEl = document.getElementById('week-strip');
    weekEl.innerHTML = '';
    const counts = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const key = fmtDate(d);
      const e = loadEntry(key);
      const count = e ? ['t','c','q','p'].filter(k => e[k]).length : 0;
      counts.push(count);
      const cell = document.createElement('div');
      cell.className = 'day' + (count > 0 ? ' lit' : '');
      cell.textContent = dayLabel(d);
      if (count > 0) {
        const opacity = 0.3 + (count / 4) * 0.7;
        cell.style.background = `rgba(255,176,0,${opacity})`;
      }
      weekEl.appendChild(cell);
    }
    let streak = 0;
    for (let i = counts.length - 1; i >= 0; i--) {
      if (counts[i] > 0) streak++; else break;
    }
    document.getElementById('streak-num').textContent = streak;
  }

  function buildHistory() {
    const listEl = document.getElementById('hist-list');
    listEl.innerHTML = '';
    const rows = [];
    for (let i = 0; i < 30; i++) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const key = fmtDate(d);
      const e = loadEntry(key);
      if (e) rows.push({ d, e });
    }
    if (rows.length === 0) {
      listEl.innerHTML = '<div class="hist-empty">NO ENTRIES YET. CHECK IN ON TODAY TO BEGIN THE LOG.</div>';
      return;
    }
    rows.forEach(({ d, e }) => {
      const row = document.createElement('div');
      row.className = 'hist-row';
      const dots = PRINCIPLES.map(p => `<div class="hist-dot ${e[p.key] ? 'on' : ''}"></div>`).join('');
      row.innerHTML = `
        <div class="hist-date">${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }).toUpperCase()}</div>
        <div class="hist-dots">${dots}</div>
      `;
      listEl.appendChild(row);
    });
  }

  document.getElementById('tab-today').addEventListener('click', () => {
    document.getElementById('tab-today').classList.add('active');
    document.getElementById('tab-history').classList.remove('active');
    document.getElementById('today-view').style.display = 'block';
    document.getElementById('history-view').classList.remove('active');
  });
  document.getElementById('tab-history').addEventListener('click', () => {
    document.getElementById('tab-history').classList.add('active');
    document.getElementById('tab-today').classList.remove('active');
    document.getElementById('today-view').style.display = 'none';
    document.getElementById('history-view').classList.add('active');
    buildHistory();
  });

  renderCards();
  buildWeekAndStreak();
})();
</script>
</body>
</html>
